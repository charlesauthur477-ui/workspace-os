version: "3.9"

# Deployed via Coolify as a "Docker Compose" resource. Coolify auto-detects
# these services, lets you assign a domain to `web` and `api` individually,
# and terminates TLS for you — you don't need your own Nginx/Traefik here.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workspaceos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: workspaceos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspaceos"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL}
      DATABASE_URL: postgresql://workspaceos:${POSTGRES_PASSWORD:-changeme}@postgres:5432/workspaceos
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      OWNER_EMAIL: ${OWNER_EMAIL}
      API_PORT: 4000
      # Phase 4 — browser-based RDP via Guacamole. GUACAMOLE_INTERNAL_URL
      # stays on the private Compose network (server-to-server only, used to
      # redeem a signed session token). GUACAMOLE_PUBLIC_URL is the domain
      # you assign to the `guacamole` service below in Coolify — the
      # frontend opens its WebSocket tunnel against it directly. Generate
      # JSON_SECRET_KEY once with `openssl rand -hex 16` and set the same
      # value on both `api` and `guacamole` below.
      GUACAMOLE_INTERNAL_URL: http://guacamole:8080/guacamole
      GUACAMOLE_PUBLIC_URL: ${GUACAMOLE_PUBLIC_URL}
      JSON_SECRET_KEY: ${JSON_SECRET_KEY}
    ports:
      - "4000"
    command: sh -c "npx prisma migrate deploy --schema prisma/schema.prisma && node dist/index.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      WEB_PORT: 3000
    ports:
      - "3000"

  # Phase 4 — Apache Guacamole. Two containers, no database of its own: the
  # `guacamole` webapp is configured with ONLY the JSON auth extension
  # (enabled below via JSON_SECRET_KEY), so it never stores users,
  # connections, or credentials — every RDP session is described fresh by
  # the `api` service at connect time (apps/api/src/modules/rdp/
  # guacamoleAuth.ts) and signed with the shared secret. There is
  # deliberately no MySQL/PostgreSQL/LDAP auth backend to provision or keep
  # in sync.
  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    # No `ports:` entry — reachable only by the `guacamole` service, over
    # the private Compose network, via the hostname `guacd`. guacd is a
    # passive proxy with no authentication of its own; never expose its
    # port (4822) publicly.

  guacamole:
    image: guacamole/guacamole:1.5.5
    restart: unless-stopped
    depends_on:
      - guacd
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      JSON_SECRET_KEY: ${JSON_SECRET_KEY}
    ports:
      - "8080"
    # Assign this service its own domain in Coolify (Configuration ->
    # General -> "Domains for guacamole"), the same way `api` and `web`
    # already have theirs. Set that domain (with /guacamole appended) as
    # GUACAMOLE_PUBLIC_URL on the `api` service above. Coolify terminates
    # TLS and proxies WebSocket upgrades the same way it already does for
    # `web`/`api` — no extra reverse-proxy config needed here.

volumes:
  postgres_data:
